spring:
  application:
    name: aipass-livesync-engine-test

  datasource:
    url: jdbc:h2:mem:aipass-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

  h2:
    console:
      enabled: false

server:
  port: 0

aipass:
  webhook:
    secret: test-secret
    auth-enabled: false
